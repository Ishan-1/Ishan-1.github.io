# Build settings
markdown: kramdown
highlighter: rouge
permalink: /posts/:year-:month-:day-:title/
future: true

kramdown:
  input: GFM
  syntax_highlighter: rouge
  math_engine: mathjax

plugins:
  - jekyll-seo-tag

exclude:
  - README.md
  - context.md
  - Gemfile
  - Gemfile.lock
  - vendor
