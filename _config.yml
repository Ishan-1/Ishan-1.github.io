title: "Ishan Gupta"
tagline: "Engineering Notebook & Architecture Deep-Dives"
description: "Technical notes, systems architecture, and engineering deep-dives on autonomous AI agents and personal software."
author:
  name: "Ishan Gupta"
  github: "Ishan-1"
url: "https://ishan-1.github.io"
